[package]
name = "gnc"
version = "0.1.0"
edition = "2021"
description = "GPU-native broadcast video codec using wgpu compute shaders"

[lib]
crate-type = ["cdylib", "rlib"]

# Explicit so that `required-features` can apply; without a `[[bin]]` section the binary is
# auto-discovered and is built for every target, including wasm. See the `cli` feature.
[[bin]]
name = "gnc"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `gnc` CLI. On by default, and a feature only so that the binary can be *excluded* from a
# target it cannot compile for: `GpuContext::new` is `#[cfg(not(target_arch = "wasm32"))]` and
# `pollster` cannot block on wasm, so type-checking a command-line tool for wasm produced 11
# errors that had nothing to do with the codec (BUG-24). The library is what WASM ships, and it
# was clean all along. `--no-default-features` is therefore the wasm build, not a reduced one.
cli = []
# BUG-25 only. Enables wgpu's SPIR-V passthrough so `spirv_pipeline_probe` can hand the driver a
# module wgpu did not generate — which is what `spirv-reduce` needs as an interestingness test.
# Off by default: it is a diagnostic, it changes no codec behaviour, and the codec must keep
# building for wasm, where passthrough is meaningless.
bug25-spirv = ["wgpu/spirv"]

[dependencies]
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document", "Element", "HtmlCanvasElement", "Window",
    "CanvasRenderingContext2d", "ImageData",
    "Performance",
    "console",
] }
js-sys = "0.3"
futures-channel = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# BUG-25: the SPIR-V that wgpu hands the driver is naga's output, so the shader has to be
# inspectable at that level rather than at WGSL level. Pinned to the version wgpu 24 already
# resolves, so this adds no download and inspects exactly the bytes the runtime ships.
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
# BUG-25: the same shader through a newer naga, under *identical* wgpu options. This is the
# experiment that decides whether "upgrade wgpu" is the fix or merely a different crash — the
# naga-30 module that built a pipeline earlier was emitted with the CLI's own bounds policy, not
# wgpu's, so it settled nothing.
naga30 = { package = "naga", version = "30", features = ["wgsl-in", "spv-out"] }

[[test]]
name = "quality_regression"
path = "tests/quality_regression.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "scene_cut_sequence"
path = "tests/scene_cut_sequence.rs"

[[bench]]
name = "codec"
harness = false

[profile.dev-fast]
inherits = "dev"
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"